[RenX_Game.Rx_Game]

; ================================================================================
; Common Server Settings
; ================================================================================

NetWait=2
TeamMode = 6 ; Determines how teams are organized between matches. 0 = static, 1 = swap, 2 = random swap, 3 = shuffle, 4 = traditional (assign as players connect), 5 = Unrestricted Traditional (Can swap teams at will, useful for DM and Creative or Test Servers), 6 = Random Shuffle/Scramble
InitialCredits=200
bAdminsStartMapVote = false 
bShowOtherGameTypes = true ; Should we show only renx maps or include all maps (TDM, Defence/etc)

;For Marathon Mode Set time limit to 0  and it is suggested to set building revival to false, while enabling vehicle airdrops
;For All Out War (Timed) matches, it is suggested to have building revivals, and to use Overtime/SD and default settings
;----------------

;-----------------------------------------------------------
;Victory Settings
;-----------------------------------------------------------
TimeLimit=50
CnCModeTimeLimit=50 ; 0 is turned off
DMModeTimeLimit=15
bBuildingsRevive = true ; It is suggested you NOT have buildings revive when there is no time limit
BuildingReviveTime = 600 ; In Seconds
bStructuresAutoRevive = False; If FALSE structure MCTs must be interacted with to revive after time has passed
bEnableAirdrops = false ; Suggest setting to true for no-timelmit / Marathon
bTeamScoreIsBuildingDamage = true ; Actual team score will be calculated by building damage only (Otherwise it totals the player points)
bWasTeamScoreIsBuildingDamage = false;

;-----------------------------------------------------------
;Time Limited Victory Settings
;-----------------------------------------------------------
bEnableOverTime = true ; Whether to use overtime or just end the game as soon as the time limit is reached 
bWasOverTimeEnabled = false ;
OverTimeTimeLimit = 1200; In Seconds (multiples of 60)
SuddenDeathTimeLimit = 600 ; In Seconds (multiples of 60)
PointsToWinBy = 15000 ; Point threshhold a team has to win by in order to actually win the game (Buildings are worth 10000) 
bSurrenderAtTimeLimit = true ; If false, the game just boringly fades to black when time is up.
SuddenDeath_DmgMult = 3.0
;-----------

;-----------------------------------------------------------
;Surrender Settings
;-----------------------------------------------------------
SurrenderLength=120 ; Ensure these are all multiples of 60 
SurrenderDisabledTime=600
ChangeMapDisabledTime=600

RecentMapsToExclude=5
MaxMapVoteSize=5
MapVoteTime=35
VehicleLimit = 20
bUsePedestal=True
MinPlayersForNukes=0
bEnableCommanders=true
bUseStaticCommanders=false
InitialCP=600
Max_CP=3000
bListed=true
bFixedMapRotation=False
bBotsDisabled=False
bBotVotesDisabled=False
bRemoveVariantMapsInVoteList=true

